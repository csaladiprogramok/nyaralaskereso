<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyaraláskereső 2027</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #17324d;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #fff4cf 0%, transparent 34%), linear-gradient(135deg, #f3d7a4, #fffaf0)
    }

    .page {
      width: min(1040px, 100%);
      margin: auto;
      padding: 20px 16px 55px
    }

    .hero {
      text-align: center;
      padding: 30px 10px 24px
    }

    .sun {
      font-size: 52px;
      display: inline-block;
      filter: drop-shadow(0 0 15px rgba(255, 183, 0, .5));
      animation: sun 3s ease-in-out infinite
    }

    h1 {
      margin-top: 8px;
      font-size: clamp(36px, 6vw, 62px);
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(90deg, #087f8c, #00b8c8, #ffb703, #ff8c42, #087f8c);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: colors 5s linear infinite
    }

    .subtitle {
      margin-top: 12px;
      font-size: clamp(15px, 2.5vw, 19px);
      font-style: italic;
      color: #566b73
    }


    /* Központi Hamarosan főfelirat */
    .coming-soon {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      margin: 0 auto 22px;
      text-align: center
    }

    .coming-soon h2 {
      flex: 0 0 auto;
      font-size: clamp(30px, 5vw, 52px);
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #087f8c, #00b8c8, #ffb703, #ff8c42, #087f8c);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 6px 12px rgba(8, 127, 140, .13));
      animation: colors 5s linear infinite, soonFloat 2.8s ease-in-out infinite
    }

    .coming-line {
      width: min(150px, 15vw);
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, #00a9b7, #ffb703, transparent)
    }

    @keyframes soonFloat {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-5px)
      }
    }

    /* Egy soros, lenyíló szűrő */
    .filter-dropdown {
      max-width: 680px;
      margin: 6px auto 28px;
      position: relative
    }

    .filter-trigger {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, .95);
      cursor: pointer;
      background: rgba(255, 255, 255, .94);
      border-radius: 999px;
      padding: 15px 54px 15px 22px;
      box-shadow: 0 14px 35px rgba(80, 60, 20, .13);
      color: #17324d;
      font-size: 15px;
      font-weight: 800;
      text-align: left;
      position: relative
    }

    .filter-trigger::after {
      content: "⌄";
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-55%);
      font-size: 24px;
      color: #087f8c;
      transition: transform .25s ease
    }

    .filter-dropdown.open .filter-trigger::after {
      transform: translateY(-45%) rotate(180deg)
    }

    .filter-menu {
      position: absolute;
      z-index: 20;
      left: 0;
      right: 0;
      top: calc(100% + 10px);
      background: rgba(255, 255, 255, .98);
      border-radius: 24px;
      padding: 9px;
      box-shadow: 0 18px 42px rgba(55, 45, 25, .18);
      border: 1px solid rgba(255, 255, 255, .95);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(.98);
      transition: .2s ease
    }

    .filter-dropdown.open .filter-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1)
    }

    .filter-option {
      width: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      text-align: left;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      color: #38525c;
      transition: .18s ease
    }

    .filter-option:hover,
    .filter-option.active {
      background: #e9f8f8;
      color: #087f8c
    }

    /* Kártyák */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      align-items: stretch
    }

    .cards.filtered {
      grid-template-columns: minmax(0, 460px);
      justify-content: center;
    }

    .cards.filtered .destination {
      width: 100%;
    }

    .destination {
      background: rgba(255, 255, 255, .96);
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 16px 38px rgba(75, 60, 25, .14);
      display: flex;
      flex-direction: column;
      min-height: 100%;
      transition: transform .3s ease, box-shadow .3s ease;
      animation: cardIn .65s ease both
    }

    .destination:nth-child(2) {
      animation-delay: .12s
    }

    .destination:nth-child(3) {
      animation-delay: .24s
    }

    .destination:hover {
      transform: translateY(-8px);
      box-shadow: 0 24px 48px rgba(75, 60, 25, .2)
    }

    .image-wrap {
      height: 225px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, #7ddfe9, #f4d28d)
    }

    .destination img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .6s ease
    }

    .destination:hover img {
      transform: scale(1.07)
    }

    .image-wrap::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 40%;
      background: linear-gradient(transparent, rgba(0, 0, 0, .2));
      pointer-events: none
    }

    .card-body {
      padding: 20px 20px 22px;
      display: flex;
      flex-direction: column;
      flex: 1
    }

    .card-body h2 {
      font-size: 26px;
      color: #087f8c;
      margin-bottom: 12px
    }

    .card-body p {
      font-size: 14px;
      line-height: 1.65;
      color: #60727b;
      margin-bottom: 24px;
      flex: 1;
      text-align: justify;
      text-justify: inter-word;
      hyphens: auto
    }

    .details-btn {
      align-self: flex-start;
      text-decoration: none;
      color: white;
      font-weight: 800;
      padding: 12px 19px;
      border-radius: 999px;
      background: linear-gradient(135deg, #00b4c4, #087f8c);
      box-shadow: 0 8px 20px rgba(8, 127, 140, .28);
      transition: .25s
    }

    .details-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 24px rgba(8, 127, 140, .36)
    }

    .no-result {
      display: none;
      grid-column: 1/-1;
      text-align: center;
      background: rgba(255, 255, 255, .85);
      border-radius: 24px;
      padding: 30px;
      font-size: 18px;
      color: #65767d
    }

    @keyframes colors {
      from {
        background-position: 0 center
      }

      to {
        background-position: 300% center
      }
    }

    @keyframes sun {

      0%,
      100% {
        transform: rotate(-7deg) scale(1)
      }

      50% {
        transform: rotate(7deg) scale(1.12)
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(30px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @media(max-width:900px) {
      .cards {
        grid-template-columns: 1fr 1fr
      }

      .image-wrap {
        height: 220px
      }
    }

    @media(max-width:620px) {
      .page {
        padding: 14px 12px 45px
      }

      .hero {
        padding: 26px 5px 23px
      }

      .sun {
        font-size: 50px
      }

      .filter-dropdown {
        margin-bottom: 24px
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 20px
      }

      .coming-soon {
        gap: 10px;
        margin-bottom: 22px
      }

      .coming-line {
        width: 45px
      }

      .image-wrap {
        height: 215px
      }

      .card-body {
        padding: 18px
      }

      .card-body h2 {
        font-size: 24px
      }

      .card-body p {
        font-size: 14px
      }

      .details-btn {
        width: 100%;
        text-align: center;
        padding: 14px 18px
      }
    }

    /* Extra mobil optimalizálás */
    @media (max-width: 620px) {
      body {
        overflow-x: hidden
      }

      .page {
        width: 100%;
        padding: 12px 10px 38px
      }

      .hero {
        padding: 22px 4px 20px
      }

      .sun {
        font-size: 44px;
        margin-bottom: 8px
      }

      h1 {
        font-size: clamp(34px, 11vw, 48px);
        letter-spacing: -1px;
        line-height: 1.05
      }

      .subtitle {
        font-size: 15px;
        line-height: 1.45;
        padding: 0 8px
      }

      .coming-soon {
        margin: 0 auto 18px;
        gap: 8px
      }

      .coming-soon h2 {
        font-size: clamp(28px, 9vw, 38px)
      }

      .coming-line {
        width: 32px
      }

      .filter-dropdown {
        width: 100%;
        max-width: none;
        margin: 4px auto 22px
      }

      .filter-trigger {
        padding: 14px 48px 14px 18px;
        font-size: 15px
      }

      .filter-trigger::after {
        right: 18px
      }

      .filter-menu {
        top: calc(100% + 7px);
        border-radius: 19px
      }

      .filter-option {
        padding: 13px 14px;
        font-size: 15px
      }

      .cards,
      .cards.filtered {
        grid-template-columns: 1fr;
        width: 100%;
        gap: 18px
      }

      .cards.filtered {
        justify-content: stretch
      }

      .destination,
      .cards.filtered .destination {
        width: 100%;
        max-width: 440px;
        margin-left: auto;
        margin-right: auto;
        border-radius: 22px
      }

      .image-wrap {
        height: 210px
      }

      .card-body {
        padding: 18px
      }

      .card-body h2 {
        font-size: 24px;
        margin-bottom: 9px
      }

      .card-body p {
        font-size: 14px;
        line-height: 1.58;
        margin-bottom: 19px;
        text-align: justify;
        text-justify: inter-word;
        hyphens: auto
      }

      .details-btn {
        width: 100%;
        text-align: center;
        padding: 13px 16px;
        font-size: 14px
      }
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 8px;
        padding-right: 8px
      }

      h1 {
        font-size: 32px
      }

      .image-wrap {
        height: 190px
      }

      .card-body {
        padding: 16px
      }

      .card-body p {
        font-size: 13.5px
      }
    }

    .close-btn:hover{background:#ff4d4d;color:#fff;border-color:#ff1a1a}
  </style>

      <script>
        const dropdown = document.getElementById("filterDropdown");
        const trigger = document.getElementById("filterTrigger");
        const options = [...document.querySelectorAll(".filter-option")];
        const cards = [...document.querySelectorAll(".destination")];
        const cardsContainer = document.getElementById("cards");

        trigger.addEventListener("click", () => {
          const isOpen = dropdown.classList.toggle("open");
          trigger.setAttribute("aria-expanded", isOpen);
        });

        options.forEach(option => {
          option.addEventListener("click", () => {
            const place = option.dataset.place;
            trigger.textContent = "🔎 " + option.textContent;

            options.forEach(item => item.classList.remove("active"));
            option.classList.add("active");

            cards.forEach(card => {
              card.style.display =
                place === "all" || card.dataset.place === place ? "" : "none";
            });

            /* Szűréskor az egyetlen találat középre kerül */
            cardsContainer.classList.toggle("filtered", place !== "all");

            dropdown.classList.remove("open");
            trigger.setAttribute("aria-expanded", "false");
          });
        });

        document.addEventListener("click", event => {
          if (!dropdown.contains(event.target)) {
            dropdown.classList.remove("open");
            trigger.setAttribute("aria-expanded", "false");
          }
        });
      </script>
